{% extends "base.html" %}
{% block title %}Eliminar programación{% endblock %}
{% block content %}
<div class="card">
    <h2>Eliminar programación</h2>
    <p>¿Confirmás que querés eliminar esta programación de <strong>{{ object.bulbs_display }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'bulbs:schedule_list' %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
