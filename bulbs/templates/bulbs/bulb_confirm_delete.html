{% extends "base.html" %}
{% block title %}Eliminar ampolleta{% endblock %}
{% block content %}
<div class="card">
    <h2>Eliminar ampolleta</h2>
    <p>¿Confirmás que querés eliminar la ampolleta <strong>{{ object.name }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'bulbs:bulb_list' %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
